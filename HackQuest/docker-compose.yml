services:
  # PostgreSQL Database with PostGIS extension
  postgres:
    image: postgis/postgis:16-3.4
    container_name: campusfixit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusfixit
      POSTGRES_PASSWORD: campusfixit_secret
      POSTGRES_DB: campusfixit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfixit"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: campusfixit-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible object storage (photos)
  minio:
    image: minio/minio:latest
    container_name: campusfixit-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: campusfixit
      MINIO_ROOT_PASSWORD: campusfixit_secret
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: campusfixit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 campusfixit campusfixit_secret;
      mc mb myminio/issues --ignore-existing;
      mc anonymous set download myminio/issues;
      exit 0;
      "

  # Backend API Server (for production)
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   container_name: campusfixit-api
  #   restart: unless-stopped
